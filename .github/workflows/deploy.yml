name: Build & Deploy to S3

# Deploys the Market History static site:
#   1. provisions/updates the CloudFormation stack (S3 + CloudFront/OAC)
#   2. builds the site (needs the processed dataset committed under data/processed/)
#   3. syncs to the bucket and invalidates the CloudFront cache
#
# AUTH: uses GitHub OIDC to assume an AWS IAM role — no long-lived AWS keys in
# the repo. Configure the role ARN and region as repository variables (below).

on:
  push:
    branches: [main]
    # Skip deploys for doc-only changes.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_NAME: seny-market-history
  PROJECT_NAME: seny-market-history
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # -- AWS auth via OIDC ---------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -- 1. Provision / update the stack ------------------------------------
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/static-site.yaml \
            --parameter-overrides ProjectName="$PROJECT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteURL'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # -- 2. Build the site ---------------------------------------------------
      - name: Build site
        run: npm run build:site

      # -- 3. Sync to S3 + invalidate cache -----------------------------------
      # Long-cache the immutable dataset/assets; keep index.html always-fresh.
      - name: Sync assets (long cache)
        run: |
          aws s3 sync dist/site "s3://${{ steps.outputs.outputs.bucket }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync index.html (no cache)
        run: |
          aws s3 cp dist/site/index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: ${{ steps.outputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Bucket: ${{ steps.outputs.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
